name: Serveur PHP

on:
  push:
    paths:
      - 'serveur/**'
      - '.github/workflows/serveur.yml'
  pull_request:
    paths:
      - 'serveur/**'
      - '.github/workflows/serveur.yml'

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} (syntaxe et tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_mysql, curl
          coverage: none
      - name: Syntaxe de tous les fichiers PHP
        run: find serveur -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests unitaires
        run: php serveur/tests/run.php

  base:
    name: ${{ matrix.image }} (schéma et intégration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mariadb:11.8
            args: ''
          - image: mysql:8.0
            args: '--default-authentication-plugin=mysql_native_password'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_mysql, curl
          coverage: none

      - name: Démarrer la base
        run: |
          docker run -d --name bdd -e MYSQL_ROOT_PASSWORD=ci -e MARIADB_ROOT_PASSWORD=ci -p 3306:3306 ${{ matrix.image }} ${{ matrix.args }}
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306", "root", "ci");' 2>/dev/null && exit 0
            sleep 2
          done
          docker logs bdd
          exit 1

      - name: Configuration de test
        run: |
          mkdir -p "$RUNNER_TEMP/prive"
          cat > "$RUNNER_TEMP/prive/config.php" <<'EOF'
          <?php
          return [
              'google_client_id' => 'client-ci.apps.googleusercontent.com',
              'admin_email' => 'admin@ci.test',
              'origines' => [],
              'db_principale' => ['hote' => '127.0.0.1', 'port' => 3306, 'nom' => 'principale', 'utilisateur' => 'root', 'mot_de_passe' => 'ci'],
              'db_chat' => ['hote' => '127.0.0.1', 'port' => 3306, 'nom' => 'chat', 'utilisateur' => 'root', 'mot_de_passe' => 'ci'],
          ];
          EOF

      - name: Créer les deux bases vides
        run: php serveur/tests/preparer-ci.php "$RUNNER_TEMP/prive/config.php"

      - name: Appliquer le schéma (principale et chat)
        run: |
          php serveur/bin/migrer.php principale "$RUNNER_TEMP/prive/config.php"
          php serveur/bin/migrer.php chat "$RUNNER_TEMP/prive/config.php"

      - name: Rejouer la migration (doit être sans effet)
        run: |
          php serveur/bin/migrer.php principale "$RUNNER_TEMP/prive/config.php" | tee /tmp/rejeu.txt
          grep -q 'déjà appliqué' /tmp/rejeu.txt

      - name: Tests d'intégration
        env:
          LPC_CONFIG: ${{ runner.temp }}/prive/config.php
        run: php serveur/tests/integration.php

  deploiement:
    name: Déploiement sur IONOS (api/)
    needs: [php, base]
    # Uniquement après un push sur main dont les tests sont verts. Jamais sur une pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement-ionos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
      #   SFTP_HOTE, SFTP_UTILISATEUR, SFTP_MOT_DE_PASSE  -> l'accès SFTP seul limité à /qocot/lespetitschercheurs.
      # Tant qu'ils sont absents, le déploiement est ignoré (avertissement) sans faire échouer le workflow.
      - name: Vérifier les secrets
        id: config
        env:
          SFTP_HOTE: ${{ secrets.SFTP_HOTE }}
          SFTP_UTILISATEUR: ${{ secrets.SFTP_UTILISATEUR }}
          SFTP_MOT_DE_PASSE: ${{ secrets.SFTP_MOT_DE_PASSE }}
        run: |
          if [ -z "$SFTP_HOTE" ] || [ -z "$SFTP_UTILISATEUR" ] || [ -z "$SFTP_MOT_DE_PASSE" ]; then
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets SFTP absents : déploiement ignoré."
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer lftp
        if: steps.config.outputs.pret == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: "Envoyer api/ (miroir : ce qui n'est plus dans le dépôt est supprimé du serveur)"
        if: steps.config.outputs.pret == 'true'
        env:
          SFTP_HOTE: ${{ secrets.SFTP_HOTE }}
          SFTP_UTILISATEUR: ${{ secrets.SFTP_UTILISATEUR }}
          LFTP_PASSWORD: ${{ secrets.SFTP_MOT_DE_PASSE }}
        run: |
          # Garde-fou : ne jamais refléter un dossier vide ou faux (cela viderait api/ sur le serveur).
          test -f serveur/api/index.php || { echo "serveur/api/index.php introuvable"; exit 1; }
          lftp -u "$SFTP_UTILISATEUR" "sftp://$SFTP_HOTE" -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; mirror --reverse --delete --verbose serveur/api api; bye"

      - name: Vérifier le service en ligne
        if: steps.config.outputs.pret == 'true'
        run: |
          for i in 1 2 3 4 5; do
            r=$(curl -sS -m 20 https://lespetitschercheurs.qocot.eu/api/ || true)
            echo "essai $i : $r"
            echo "$r" | grep -q '"ok":true' && exit 0
            sleep 5
          done
          exit 1
