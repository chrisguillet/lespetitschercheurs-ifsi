name: Import de l'ancien Sheet

# Lance l'import différentiel côté serveur (api/importer.php). Les données vont du Sheet au serveur : ni ce workflow ni
# le dépôt ne les voient ; le rapport ne contient que des nombres.
# Manuel : onglet Actions > « Import de l'ancien Sheet » > Run workflow (option « à blanc » pour simuler sans rien écrire).
# Automatique (toutes les heures) : seulement si la variable de dépôt IMPORT_AUTO vaut « true » (Settings > Variables).

on:
  workflow_dispatch:
    inputs:
      a_blanc:
        description: "À blanc : compter sans rien écrire"
        type: boolean
        default: true
      supprimer:
        description: "Supprimer côté serveur ce qui a disparu du Sheet (si la base n'a pas bougé)"
        type: boolean
        default: false
      fichiers:
        description: "Importer aussi les pièces jointes du Drive"
        type: boolean
        default: true
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: import-sheet
  cancel-in-progress: false

jobs:
  importer:
    name: Importer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.IMPORT_AUTO == 'true'
    steps:
      - name: Lancer l'import
        env:
          MIGRATION_JETON: ${{ secrets.MIGRATION_JETON }}
          A_BLANC: ${{ github.event_name == 'workflow_dispatch' && inputs.a_blanc && '1' || '0' }}
          SUPPRIMER: ${{ github.event_name == 'workflow_dispatch' && inputs.supprimer && '1' || '0' }}
          FICHIERS: ${{ github.event_name != 'workflow_dispatch' || inputs.fichiers && '1' || '0' }}
        run: |
          if [ -z "$MIGRATION_JETON" ]; then
            echo "::error::Secret MIGRATION_JETON absent."
            exit 1
          fi
          reponse=$(curl -sS -m 590 -X POST -H "X-Migration-Token: $MIGRATION_JETON" \
            "https://lespetitschercheurs.qocot.eu/api/importer.php?a_blanc=$A_BLANC&supprimer=$SUPPRIMER&fichiers=$FICHIERS" || true)
          echo "$reponse"
          # Le rapport (nombres seulement) devient une annotation lisible sans ouvrir les journaux.
          echo "::notice::Import (à blanc=$A_BLANC, supprimer=$SUPPRIMER, fichiers=$FICHIERS) : $reponse"
          echo "$reponse" | grep -q '"ok":true' || { echo "::error::Import échoué : $reponse"; exit 1; }
